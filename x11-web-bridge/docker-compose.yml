version: '3.8'

services:
  x11-web-bridge:
    build: .
    container_name: x11-web-bridge
    ports:
      - "127.0.0.1:2222:22"     # SSH tunnel endpoint
    environment:
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_DEPTH=24
      - VNC_PORT=5901
      - VNC_PASSWORD=${VNC_PASSWORD:?VNC_PASSWORD must be set}
      - SSH_AUTHORIZED_KEY=${SSH_AUTHORIZED_KEY:?SSH_AUTHORIZED_KEY must be set}
    volumes:
      - vnc_data:/home/vnc/.vnc
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    networks:
      - x11-guacamole

volumes:
  vnc_data:

networks:
  x11-guacamole:
    name: ${X11_DOCKER_NETWORK:-x11-guacamole}
    external: true
